<body class="qr-page">
  <header class="site-header qr-header">
    <a class="brand" href="/" aria-label="Good News OTR home">
      <span class="brand-script">Good News</span>
      <span class="brand-otr">OTR</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/#devotional">Devotional</a>
      <a href="/#study">Bible Study</a>
      <a class="nav-prayer" href="/#prayer">Request Prayer</a>
      <a href="/qr/" aria-current="page">QR Code</a>
      <button class="nav-share" type="button" data-share-site>Share</button>
    </nav>
  </header>

  <main class="qr-main">
    <section class="qr-card" aria-labelledby="qrTitle">
      <p class="script-logo qr-script">Good News</p>
      <h1 id="qrTitle">Scan for OTR</h1>
      <p class="qr-copy">Open this page on your phone, then let someone scan the code to visit Good News OTR.</p>
      <img class="qr-code" src="../assets/goodnewsotr-qr.svg" alt="QR code for https://goodnewsotr.netlify.app/">
      <a class="site-url" href="https://goodnewsotr.netlify.app/">goodnewsotr.netlify.app</a>
      <div class="qr-actions">
        <button class="button primary" type="button" data-share-site>Share site</button>
        <a class="text-link qr-home-link" href="/">Back to site</a>
      </div>
    </section>
  </main>

  <script src="../share.js"></script>
</body>
